name: gantt-ci

on:
  push:
    paths:
      - "ganttChart/**"
      - ".github/workflows/gantt-ci.yml"
  pull_request:
    paths:
      - "ganttChart/**"
      - ".github/workflows/gantt-ci.yml"

defaults:
  run:
    working-directory: ganttChart

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ganttChart/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=moderate
      - run: npx pbiviz package
      - run: npx pbiviz package --certification-audit
      - name: ECOSYSTEM pointer (no full copy)
        working-directory: ${{ github.workspace }}
        run: |
          if grep -q "Canonical source of truth" ECOSYSTEM.md; then
            echo "ECOSYSTEM.md is a pointer — OK"
          else
            echo "ECOSYSTEM.md must remain a pointer to Website, not a full copy" >&2
            exit 1
          fi
      - name: White-label GUID in pbiviz
        working-directory: ${{ github.workspace }}
        run: |
          guid=$(node -e "console.log(require('./ganttChart/pbiviz.json').visual.guid)")
          test "$guid" = "ganttChartWL7E4A9C2F1B8D4056AE12F34B56C78D01"
          test ! -d website-sync
